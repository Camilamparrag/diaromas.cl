[tool.ruff]
line-length = 92
target-version = "py312"
exclude = [".venv", "venv", "staticfiles", "media", "*/migrations/*"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # comprehensions
]
ignore = [
  "E501",    # el ancho lo controla el formateador
  "B008",    # llamadas en tiempo de importación son intencionales
]

[tool.ruff.lint.per-file-ignores]
"apps/*/tests.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"