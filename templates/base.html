{% load static %}<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Diaromas{% endblock %} · Aromatizantes y difusores</title>
    <meta
      name="description"
      content="{% block descripcion %}Velas aromáticas, difusores y aceites esenciales hechos con esencias naturales. Tu pedido se cierra por WhatsApp.{% endblock %}"
    />
    <meta name="theme-color" content="#4a4e2d" />
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    {% block estilos %}{% endblock %}
  </head>
  <body>
    <a class="salto-contenido" href="#contenido">Ir al contenido</a>

    {% include 'partials/header.html' %}

    <main id="contenido" class="contenedor">
      {% block contenido %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <script src="{% static 'js/main.js' %}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
