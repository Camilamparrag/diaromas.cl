services:
  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: diaromas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diaromas}
      POSTGRES_USER: ${POSTGRES_USER:-diaromas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diaromas_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo para poder conectar herramientas locales (DBeaver, psql, .venv)
      - "${POSTGRES_PORT_PUBLISHED:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diaromas} -d ${POSTGRES_DB:-diaromas}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - diaromas

  # -------------------------------------------------------------------------
  # Django
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diaromas_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env
        required: false # permite levantar el stack sin .env (usa defaults de dev)
    environment:
      # Por defecto la web talks con el servicio `db`; se puede sobrescribir en .env
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      DJANGO_SETTINGS_MODULE: config.settings
    # Permite conectar a herramientas que corren en el host (DBeaver, psql) usando
    # host.docker.internal. En equipos normales basta con POSTGRES_HOST=db.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Código en vivo: recarga automática al guardar
      - .:/app
      # Estáticos y medias en volúmenes para no perderlos al reconstruir
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - diaromas

volumes:
  pgdata:
  static_volume:
  media_volume:

networks:
  diaromas:
    driver: bridge